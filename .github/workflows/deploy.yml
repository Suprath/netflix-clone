name: Deploy Netflix Clone Application

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.set_image_name.outputs.image }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16' # Use Node 16 as per Dockerfile

    - name: Install npm dependencies
      run: npm install

    - name: Build React application
      run: npm run build

    - name: Set image name
      id: set_image_name
      env:
        OWNER: ${{ github.repository_owner }}
        REPO: ${{ github.event.repository.name }}
      run: |
        OWNER_LOWER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
        REPO_LOWER=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
        IMAGE_NAME="ghcr.io/$OWNER_LOWER/$REPO_LOWER"
        echo "image=$IMAGE_NAME" >> $GITHUB_OUTPUT

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.set_image_name.outputs.image }}:${{ github.sha }}, ${{ steps.set_image_name.outputs.image }}:latest
        build-args:
          TMDB_V3_API_KEY: ${{ secrets.TMDB_V3_API_KEY }}

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ steps.set_image_name.outputs.image }}:${{ github.sha }}'
        format: 'table'
        exit-code: '0' # Non-blocking scan
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

  deploy_test:
    needs: build_and_test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/develop'
    environment: Test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Test
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          echo "$KUBE_CONFIG_DATA" > kubeconfig.yaml
          export KUBECONFIG=./kubeconfig.yaml
          microk8s kubectl apply -k k8s/overlays/test
          microk8s kubectl -n test set image deployment/netflix-clone-app netflix-clone-app=${{ needs.build_and_test.outputs.image_name }}:${{ github.sha }}

  deploy_staging:
    needs: build_and_test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    environment: Staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Staging
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          echo "$KUBE_CONFIG_DATA" > kubeconfig.yaml
          export KUBECONFIG=./kubeconfig.yaml
          microk8s kubectl apply -k k8s/overlays/staging
          microk8s kubectl -n staging set image deployment/netflix-clone-app netflix-clone-app=${{ needs.build_and_test.outputs.image_name }}:${{ github.sha }}

  deploy_production:
    needs: build_and_test
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch'
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Production
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          echo "$KUBE_CONFIG_DATA" > kubeconfig.yaml
          export KUBECONFIG=./kubeconfig.yaml
          microk8s kubectl apply -k k8s/overlays/production
          microk8s kubectl -n production set image deployment/netflix-clone-app netflix-clone-app=${{ needs.build_and_test.outputs.image_name }}:${{ github.sha }}
